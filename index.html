 CARS.forEach(function(c){if((c.t||"car")!==S.t)return;c.b.split("/").forEach(function(x){x=x.trim();var k=N(x);if(!B.some(function(b){return bm(b.k,k)}))B.push({n:x,k:k,id:null})})});
 if(S.t==="car")Object.keys(EXTRA).forEach(function(n){var k=N(n);if(!B.some(function(b){return bm(b.k,k)}))B.push({n:n,k:k,id:null})});
 B.sort(function(a,b){return a.n.localeCompare(b.n)});draw()}
async function lazy(img){var t=img.dataset.t,u=IC[t];
 if(u===undefined){u=null;try{var w=await jget("https://en.wikipedia.org/api/rest_v1/page/summary/"+enc(t.replace(/ /g,"_")));if(w.type!=="disambiguation"&&w.thumbnail&&!LG.test(w.thumbnail.source))u=w.thumbnail.source}catch(e){}IC[t]=u}
 if(u){img.src=u;img.style.display="block"}}
function draw(){ui();var t=TX[L],q=N($("q").value),h="";
 if(S.v==="home"){var l=B.filter(function(b){return!q||b.k.indexOf(q)>=0});
  h=(failed?'<p class="mut">'+t.fail+'</p>':"")+'<h2>'+t.brands+' ('+l.length+')</h2><div class="grid">'+l.map(function(b){return'<button class="chip" data-b="'+B.indexOf(b)+'">'+esc(b.n)+(curFor(b.k).length?'<small>'+t.cur+'</small>':"")+'</button>'}).join("")+'</div>'+(l.length?"":t.none)}
 else if(S.v==="brand"){var m=S.items.filter(function(x){return!q||N(x.n).indexOf(q)>=0});
  h='<button class="back" id="bk">'+t.back+'</button><h2>'+esc(S.b.n)+' · '+t.models+' ('+m.length+')</h2><div class="grid">'+m.map(function(x){return'<button class="chip" data-m="'+S.items.indexOf(x)+'"><img class="th" alt="" style="display:none" data-t="'+esc(x.c?x.c.w:S.b.n+" "+x.n)+'">'+esc(x.n)+(x.c?'<small>'+t.cur+'</small>':"")+'</button>'}).join("")+'</div>'+(m.length?"":t.none)}
 $("view").innerHTML=h;
 $("view").querySelectorAll("[data-b]").forEach(function(e){e.onclick=function(){openBrand(B[+e.dataset.b])}});
 $("view").querySelectorAll("[data-m]").forEach(function(e){e.onclick=function(){openModel(S.items[+e.dataset.m])}});
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);lazy(e.target)}})},{rootMargin:"250px"});
 $("view").querySelectorAll("img.th").forEach(function(i){io.observe(i)});
 var bk=$("bk");if(bk)bk.onclick=function(){S.v="home";$("q").value="";draw()}}
async function openBrand(b){S.v="brand";S.b=b;S.items=[];$("q").value="";$("view").textContent=TX[L].load;
 var cur=curFor(b.k),names=[],mk=enc(b.n),y=S.y,urls=[];
 if(y!=="all"){urls.push(API+"GetModelsForMakeYear/make/"+mk+"/modelyear/"+y+"/vehicletype/"+S.t+"?format=json",API+"GetModelsForMakeYear/make/"+mk+"/modelyear/"+y+"?format=json")}
 if(b.id)urls.push(API+"GetModelsForMakeId/"+b.id+"?format=json");
 for(var j=0;j<urls.length&&!names.length;j++){try{var d=await jget(urls[j]);d.Results.forEach(function(r){if(names.indexOf(r.Model_Name)<0)names.push(r.Model_Name)})}catch(e){}}
 names.sort();var used=[];
 S.items=names.map(function(n){var c=N(n).length>=3?cur.filter(function(c){return N(c.m).indexOf(N(n))>=0})[0]:null;if(c)used.push(c);return{n:n,c:c,us:true}});
 cur.forEach(function(c){if(used.indexOf(c)<0)S.items.push({n:c.m,c:c,us:false})});
 if(S.t==="car")Object.keys(EXTRA).forEach(function(n){if(!bm(N(n),b.k))return;EXTRA[n].forEach(function(m){var k=N(m);if(!S.items.some(function(x){return N(x.n)===k||(x.c&&N(x.c.m).indexOf(k)===0)}))S.items.push({n:m,c:null,us:false})})});
 S.items.sort(function(a,b){return a.n.localeCompare(b.n,undefined,{numeric:true})});draw()}
async function wiki(title){var lg=L==="ar"?["ar","en"]:["en"];
 for(var j=0;j<lg.length;j++){try{var w=await jget("https://"+lg[j]+".wikipedia.org/api/rest_v1/page/summary/"+enc(title.replace(/ /g,"_")));if(w.type!=="disambiguation")return w}catch(e){}}
 try{var o=await jget("https://en.wikipedia.org/w/api.php?action=opensearch&limit=1&format=json&origin=*&search="+enc(title));if(o[1][0])return await jget("https://en.wikipedia.org/api/rest_v1/page/summary/"+enc(o[1][0].replace(/ /g,"_")))}catch(e){}return null}
async function commons(title){try{var d=await jget("https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrnamespace=6&gsrlimit=15&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=360&format=json&origin=*&gsrsearch="+enc(title+" filetype:bitmap"));
 return Object.keys(d.query.pages).map(function(k){var p=d.query.pages[k],i=p.imageinfo&&p.imageinfo[0];if(i)i.t=p.title;return i}).filter(function(i){return i&&i.mime==="image/jpeg"&&!LG.test(i.t)}).slice(0,6)}catch(e){return[]}}

 if(!x.us){el.innerHTML='<p class="mut">'+t.noapi+'</p>';return}
 el.innerHTML=t.load;
 try{var d=await jget("https://api.nhtsa.gov/recalls/recallsByVehicle?make="+enc(S.b.n)+"&model="+enc(x.n)+"&modelYear="+y);var r=d.results||[];
  el.innerHTML=r.length?r.slice(0,10).map(function(c){return'<div class="rc"><b>'+esc(c.Component||"")+'</b> · <a target="_blank" rel="noopener" href="https://www.nhtsa.gov/recalls?nhtsaId='+esc(c.NHTSACampaignNumber)+'">'+esc(c.NHTSACampaignNumber)+'</a><div>'+esc((c.Summary||"").slice(0,350))+'</div><i>'+t.fix+esc((c.Remedy||"").slice(0,300))+'</i></div>'}).join(""):'<p class="mut">'+t.norec+'</p>'}
 catch(e){el.innerHTML='<p class="mut">'+t.fail+'</p>'}}
async function openModel(x){S.v="detail";S.x=x;var t=TX[L],b=S.b,c=x.c;ui();var nm=esc(b.n+" "+(c&&!x.us?c.m:x.n)),title=c?c.w:b.n+" "+x.n;
 $("view").innerHTML='<button class="back" id="bk">'+t.back+'</button><h2>'+nm+'</h2><div class="mut">'+t.load+'</div>';$("bk").onclick=function(){S.v="brand";draw()};
 var r=await Promise.all([wiki(title),commons(title)]),w=r[0],g=r[1],img=w&&w.thumbnail&&!LG.test(w.thumbnail.source)?w.thumbnail.source:(g[0]?g[0].thumburl:null);
 var h='<button class="back" id="bk">'+t.back+'</button><h2>'+nm+'</h2><div class="detail"><div>'+(img?'<img alt="'+nm+'" src="'+esc(img)+'">':'<div class="ph">🚗</div>')+
 (g.length?'<div class="gal" title="'+t.gal+'">'+g.map(function(i){return'<a href="'+esc(i.descriptionurl)+'" target="_blank" rel="noopener"><img loading="lazy" alt="" src="'+esc(i.thumburl)+'"></a>'}).join("")+'</div>':"")+'</div><div>';
 if(w&&w.extract)h+='<div class="box"><p style="margin:0">'+esc(w.extract)+'</p>'+(w.content_urls?'<p class="mut" style="margin:6px 0 0"><a href="'+esc(w.content_urls.desktop.page)+'" target="_blank" rel="noopener">'+t.src+'</a></p>':"")+'</div>';
 if(c){h+='<div class="box"><table><tr><td>'+t.eng+'</td><td>'+esc(c.sp[0])+'</td></tr><tr><td>'+t.hp+'</td><td>'+esc(c.sp[1])+'</td></tr><tr><td>'+t.fuel+'</td><td>'+F[c.sp[2]][I()]+'</td></tr></table></div>'+(c.pr[0]==="?"?'<div class="box mut">'+t.pl+' <a href="https://www.moteur.ma" target="_blank" rel="noopener">Moteur.ma</a> · <a href="https://www.avito.ma" target="_blank" rel="noopener">Avito.ma</a></div>':'<div class="box pr"><div>'+t.pn+'<b>'+c.pr[0]+'</b></div><div>'+t.pu+'<b>'+c.pr[1]+'</b></div></div>')+'<div class="box"><h3>'+t.pb+'</h3>'+(c.p.length?"":'<p class="mut" style="margin:0">'+t.nop+'</p>')+c.p.map(function(p){return'<div class="p"><div class="t">'+esc(p[0][I()])+'</div><div class="s">'+esc(p[1][I()])+'</div></div>'}).join("")+'</div>'}
 else h+='<div class="box mut">'+t.nodata+'</div>';
 var dy=S.y==="all"?CY-1:S.y,ys="";for(var y=CY+1;y>=1990;y--)ys+='<option'+(y==dy?" selected":"")+'>'+y+'</option>';
 h+='<div class="box"><h3>'+t.rec+' <select id="ry">'+ys+'</select></h3><div id="rec"></div><p style="margin:8px 0 0"><a target="_blank" rel="noopener" href="https://www.google.com/search?q='+enc(b.n+" "+x.n+" common problems")+'">'+t.g+'</a></p></div></div></div>';
 $("view").innerHTML=h;$("bk").onclick=function(){S.v="brand";draw()};$("ry").onchange=function(){recalls(x)};recalls(x)}
